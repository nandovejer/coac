name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Rebuild diario a las 03:15 UTC (04:15 en Madrid en invierno, tras el fin de las
  # sesiones de la madrugada): el HTML prerenderizado lleva «Hoy» y «Mañana» del día
  # del build. GitHub desactiva los cron de un repo sin actividad en 60 días.
  schedule:
    - cron: "15 3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run check:contrast
      - run: pnpm run test
      - run: pnpm run build
        env:
          TZ: Europe/Madrid
      - run: pnpm run check:prerender
      - run: pnpm run lint:luz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
