<template>
  <style>
    #root { position: absolute; inset: 0; overflow: hidden; font-family: Poppins, sans-serif; }
    #jokes-ground { position: absolute; inset: 0; background: #f3ece2; transform-origin: 50% 100%; }
    #jokes-kicker { position: absolute; left: 80px; top: 200px; margin: 0; color: #192c60; font-weight: 600; font-size: 46px; letter-spacing: 0.12em; text-transform: uppercase; }
    /* Panel de horarios: cuatro filas centradas en la zona segura (330–1250 px). */
    .jokes-row { position: absolute; left: 80px; width: 920px; height: 210px; transform-origin: 0% 100%; }
    .jokes-tile { position: absolute; left: 0; top: 0; width: 210px; height: 210px; border-radius: 22px; background: #192c60; }
    .jokes-tile p { position: absolute; inset: 0; margin: 0; display: flex; align-items: center; justify-content: center; color: #f3ece2; font-weight: 800; font-size: 170px; line-height: 1; }
    /* La raya de las fichas que giran: el detalle del panel de horarios. */
    .jokes-tile::after { content: ""; position: absolute; left: 0; right: 0; top: 103px; height: 4px; background: rgb(0 0 0 / 0.22); }
    .jokes-rests { position: absolute; left: 240px; top: 0; width: 680px; height: 210px; }
    .jokes-rest { position: absolute; left: 0; top: 50%; margin: -0.6em 0 0; color: #192c60; font-weight: 800; font-size: 92px; line-height: 1.2; letter-spacing: -0.02em; white-space: nowrap; }
    .jokes-rest--long { font-size: 74px; }
    #jokes-sticker { position: absolute; left: 600px; top: 390px; width: 400px; margin: 0; padding: 26px 30px; border-radius: 16px; background: #ffffff; color: #192c60; font-weight: 700; font-size: 44px; line-height: 1.2; text-align: center; box-shadow: 0 12px 0 #192c60; }
    .jokes-z { position: absolute; margin: 0; color: #8fb0ff; font-weight: 800; }
  </style>
  <div id="root" data-composition-id="jokes" data-width="1080" data-height="1920">
    <div id="jokes-ground"></div>
    <p id="jokes-kicker">COAC, según a quién preguntes</p>

    <div class="jokes-row" style="top: 330px" data-layout-allow-overlap>
      <div class="jokes-tile"><p>C</p></div>
      <div class="jokes-rests">
        <p class="jokes-rest jokes-v0">on</p>
        <p class="jokes-rest jokes-v1">oplas</p>
        <p class="jokes-rest jokes-v2">uándo</p>
        <p class="jokes-rest jokes-v3">ada</p>
        <p class="jokes-rest jokes-v4">oge</p>
        <p class="jokes-rest jokes-v5">oro</p>
      </div>
    </div>
    <div class="jokes-row" style="top: 566px" data-layout-allow-overlap>
      <div class="jokes-tile"><p>O</p></div>
      <div class="jokes-rests">
        <p class="jokes-rest jokes-v0">ído</p>
        <p class="jokes-rest jokes-v1">rdenadas</p>
        <p class="jokes-rest jokes-v2">ír</p>

    </div>
    <div class="jokes-row" style="top: 802px" data-layout-allow-overlap>
      <div class="jokes-tile"><p>A</p></div>
      <div class="jokes-rests">
        <p class="jokes-rest jokes-v0">l</p>
        <p class="jokes-rest jokes-v1">l</p>
        <p class="jokes-rest jokes-rest--long jokes-v2">grupaciones de</p>
        <p class="jokes-rest jokes-v3">&nbsp;su hora,</p>
        <p class="jokes-rest jokes-v4">ntes que</p>
        <p class="jokes-rest jokes-v5">garrar la</p>
      </div>

    <div class="jokes-row" style="top: 1038px" data-layout-allow-overlap>
      <div class="jokes-tile"><p>C</p></div>
      <div class="jokes-rests">
        <p class="jokes-rest jokes-v0">oncurso</p>
        <p class="jokes-rest jokes-v1">ompás</p>
        <p class="jokes-rest jokes-v2">ádiz</p>
        <p class="jokes-rest jokes-v3">antando</p>
        <p class="jokes-rest jokes-v4">anten</p>

      </div>
    </div>

    <p id="jokes-sticker" data-layout-allow-occlusion>(la cervecita, se&nbsp;entiende)</p>
    <p class="jokes-z" id="jokes-z1" style="left: 640px; top: 1060px; font-size: 70px">z</p>
    <p class="jokes-z" id="jokes-z2" style="left: 720px; top: 980px; font-size: 90px">z</p>
    <p class="jokes-z" id="jokes-z3" style="left: 820px; top: 880px; font-size: 115px">z</p>
  </div>
  <script>
    (() => {
      // Va al doble de rápido: se escribe a velocidad normal y se reproduce con timeScale(2).
      const tl = gsap.timeline();
      // Cuándo aparece cada acrónimo (segundos de la escena): cada uno, justo
      // antes de que la voz lo lea (ver la pista de voz en index.html).
      const AT = [2.0, 3.7, 6.1, 8.4, 10.9, 15.4];
      const END = 18.6;
      // Un mundo de color por acrónimo: fondo, texto, ficha y letra de la ficha.
      const LOOKS = [
        ["#f3ece2", "#192c60", "#192c60", "#f3ece2"],
        ["#2d51a5", "#f3ece2", "#f3ece2", "#2d51a5"],
        ["#192c60", "#f3ece2", "#e3ab93", "#192c60"],
        ["#e3ab93", "#192c60", "#192c60", "#e3ab93"],
        ["#facc15", "#192c60", "#192c60", "#facc15"],
        ["#111118", "#f2f2f8", "#8fb0ff", "#111118"],
      ];
      const tiles = gsap.utils.toArray(".jokes-tile");
      const letters = gsap.utils.toArray(".jokes-tile p");
      const rows = gsap.utils.toArray(".jokes-row");

      gsap.set(".jokes-rest", { opacity: 0 });
      gsap.set(["#jokes-sticker", ".jokes-z"], { opacity: 0 });

      // Entrada: el fondo sube y las cuatro fichas caen una tras otra.
      tl.fromTo("#jokes-ground", { scaleY: 0 }, { scaleY: 1, duration: 0.35, ease: "power3.inOut" }, 0);
      tl.fromTo("#jokes-kicker", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out" }, 0.36);
      tl.fromTo(tiles, { y: -260, rotation: -8, opacity: 0 }, { y: 0, rotation: 0, opacity: 1, duration: 0.55, ease: "back.out(1.6)", stagger: 0.09 }, 0.35);

      AT.forEach((at, v) => {
        const [ground, ink, tile, tileInk] = LOOKS[v];
        const rests = gsap.utils.toArray(`.jokes-v${v}`);
        if (v > 0) {
          // El color inunda el fondo mientras las fichas giran y cambian de color a media vuelta.
          tl.to("#jokes-ground", { backgroundColor: ground, duration: 0.3, ease: "power2.inOut" }, at - 0.15);
          tl.to(tiles, { scaleY: 0, duration: 0.09, ease: "power2.in", stagger: 0.04 }, at - 0.12);
          tl.set(tiles, { backgroundColor: tile }, at);
          tl.set(letters, { color: tileInk }, at);
          tl.set("#jokes-kicker", { color: ink }, at + 0.08);
          tl.to(tiles, { scaleY: 1, duration: 0.16, ease: "back.out(2.2)", stagger: 0.04 }, at - 0.03);
        }
        tl.set(rests, { color: ink }, at);
        // Las palabras ruedan de arriba, como en una tragaperras.
        tl.fromTo(rests, { opacity: 0, y: -50, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.22, ease: "power3.out", stagger: 0.05 }, at + 0.18);
        const next = AT[v + 1];
        if (next) tl.to(rests, { opacity: 0, y: 50, filter: "blur(6px)", duration: 0.13, ease: "power2.in", stagger: 0.03 }, next - 0.24);
      });

      // «La cervecita, se entiende»: una pegatina que se planta cuando la voz lo dice.
      tl.fromTo("#jokes-sticker", { opacity: 0, scale: 1.6, rotation: 18 }, { opacity: 1, scale: 1, rotation: 7, duration: 0.35, ease: "back.out(2)" }, 12.6);
      tl.to("#jokes-sticker", { opacity: 0, scale: 0.8, duration: 0.13, ease: "power2.in" }, AT[5] - 0.24);

      // El remate: llega la noche y el panel se queda dormido.
      const SLEEP = 16.9;
      rows.forEach((row, i) => {
        tl.to(row, { rotation: -2.5 * (i + 1), y: 14 * i, duration: 0.6, ease: "elastic.out(1, 0.45)" }, SLEEP + i * 0.07);
      });
      ["#jokes-z1", "#jokes-z2", "#jokes-z3"].forEach((id, i) => {
        tl.fromTo(id, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power2.out" }, SLEEP + 0.35 + i * 0.2);
      });
      tl.set({}, {}, END);
      const root = gsap.timeline({ paused: true });
      root.add(tl.timeScale(2), 0);
      window.__timelines["jokes"] = root;
    })();
  </script>
